`<div class="w"><table><tr><th>Associação</th><th>Representante</th><th>Contacto</th><th>Clubes</th><th>Atletas</th><th></th></tr>${(a||[]).map(x=>`<tr><td>${esc(x.nome)}</td><td>${esc(x.representante)}</td><td>${esc(x.contacto)}</td><td>${n(cl,x.id)}</td><td>${n(t,x.id)}</td><td><button onclick="ver('${x.id}')">Ver ficha</button> ${pg(x.id)?`<button onclick="gerir('${x.id}')">⚙ Gerir</button>`:''}</td></tr>`).join('')}</table></div>`}

async function atlF(){const[{data:a},{data:z}]=await Promise.all([db.from('atletas_v').select('id,nome,idade,sexo,escalao,categoria_peso,associacao_id'),db.from('associacoes').select('id,nome')]);const S=Object.fromEntries((z||[]).map(x=>[x.id,x.nome]));

async function assocV(){const f=AID=='fct',q=(t,s)=>{const r=db.from(t).select(s);return f?r.is('associacao_id',null):r.eq('associacao_id',AID)};

async function hist(id){if(!id)return $('#hs').innerHTML='';const[{data:c},{data:m},{data:cs},{data:a}]=await Promise.all([db.from('combates').select('*').or(`atleta_a.eq.${id},atleta_b.eq.${id}`).order('ronda'),db.from('inscricoes').select('competicao_id,medalha').eq('atleta_id',id),db.from('competicoes').select('id,nome,data,tipo'),db.from('atletas_v').select('id,nome')]);
const C=Object.fromEntries(cs.map(x=>[x.id,x])),N=Object.fromEntries(a.map(x=>[x.id,x.nome]));
$('#hs').innerHTML='<h4>Competições e medalhas</h4>'+tb(m.map(x=>({Competição:C[x.competicao_id]?.nome,Data:C[x.competicao_id]?.data,Tipo:C[x.competicao_id]?.tipo,Medalha:x.medalha||'—'})).sort((p,q)=>(q.Data||'').localeCompare(p.Data||'')),['Competição','Data','Tipo','Medalha'])+'<h4>Combates</h4>'+tb(c.map(x=>{const A=x.atleta_a==id;return{Competição:C[x.competicao_id]?.nome,Ronda:x.ronda,Adversário:N[A?x.atleta_b:x.atleta_a],Pontos:`${A?x.pontos_a:x.pontos_b} - ${A?x.pontos_b:x.pontos_a}`,Resultado:x.vencedor?(x.vencedor==id?'Vitória':'Derrota'):'—'}}),['Competição','Ronda','Adversário','Pontos','Resultado'])}
init();
